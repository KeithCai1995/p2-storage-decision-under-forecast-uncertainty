[project]
name = "forecast-to-storage-decision"
version = "1.0.2"
description = "Risk-aware battery scheduling driven by calibrated probabilistic forecasts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
